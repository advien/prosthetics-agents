<svg viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" width="680" height="560" role="img" aria-labelledby="ttl dsc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title id="ttl">Prosthetics agents — stage B clinical fitting crew, with stages C and A planned</title>
<desc id="dsc">A referral enters a five-agent crew: intake, biomechanics, recommendation, safety review and documentation. The safety agent is the only path to documentation; it checks component weight ratings and K-level ranges deterministically, sends the recommendation back with required changes through a bounded revision loop, or escalates to the clinical team. Stages C (fabrication on LangGraph) and A (real-time control on AutoGen) are shown as planned.</desc>
<style>
  :root{
    --card:#F4F2EC; --card-bd:#D3D1C7; --panel:#FAF9F5; --panel-bd:#E3E1D8;
    --line:#9C9A92; --ink:#2C2C2A; --ink2:#5F5E5A;
    --accent-bg:#FAECE7; --accent-bd:#F0997B; --accent-ink:#993C1D;
  }
  .t  { fill: var(--ink); }
  .t2 { fill: var(--ink2); }
  .title{ font-size:15.5px; font-weight:700; }
  .sub  { font-size:12px; }
  .note { font-size:11.5px; }
  .panel{ fill: var(--panel); stroke: var(--panel-bd); stroke-width:1.5; }
  .node { fill: var(--card); stroke: var(--card-bd); stroke-width:1.5; }
  .hot  { fill: var(--accent-bg); stroke: var(--accent-bd); stroke-width:1.8; }
  .conn { stroke: var(--line); stroke-width:2; fill:none; }
  .dot  { stroke: var(--line); stroke-width:1.4; stroke-dasharray:2 4; fill:none; }
  .plan { fill: var(--panel); stroke: var(--panel-bd); stroke-width:1.5; stroke-dasharray:6 4; }
  .hotnote { fill: var(--accent-ink); font-size:11.5px; font-weight:600; }
  .badge{ fill: var(--ink2); font-size:10.5px; font-weight:700; letter-spacing:0.06em; }
</style>
<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
  </marker>
</defs>

<text class="t title" x="34" y="34">Prosthetics Agents — stage B: clinical fitting crew</text>
<text class="t2 sub"  x="34" y="54">Five CrewAI agents over one shared patient record. The safety gate is a tool, not the model's arithmetic.</text>

<!-- referral -->
<rect class="node" x="34" y="80" width="130" height="46" rx="10"/>
<text class="t" x="99" y="102" font-size="13" font-weight="700" text-anchor="middle">Referral</text>
<text class="t2 note" x="99" y="118" text-anchor="middle">free text</text>

<path class="conn" d="M164,103 L196,103" marker-end="url(#arw)"/>

<!-- intake -->
<rect class="node" x="198" y="80" width="130" height="46" rx="10"/>
<text class="t" x="263" y="102" font-size="13" font-weight="700" text-anchor="middle">Intake</text>
<text class="t2 note" x="263" y="118" text-anchor="middle">patient record</text>

<path class="conn" d="M328,103 L360,103" marker-end="url(#arw)"/>

<!-- biomech -->
<rect class="node" x="362" y="80" width="130" height="46" rx="10"/>
<text class="t" x="427" y="102" font-size="13" font-weight="700" text-anchor="middle">Biomech</text>
<text class="t2 note" x="427" y="118" text-anchor="middle">assessment</text>

<path class="conn" d="M492,103 L524,103" marker-end="url(#arw)"/>

<!-- recommendation -->
<rect class="node" x="526" y="80" width="120" height="46" rx="10"/>
<text class="t" x="586" y="102" font-size="13" font-weight="700" text-anchor="middle">Recommend</text>
<text class="t2 note" x="586" y="118" text-anchor="middle">device + parts</text>

<path class="conn" d="M586,126 L586,168" marker-end="url(#arw)"/>

<!-- safety gate -->
<rect class="hot" x="300" y="170" width="346" height="78" rx="12"/>
<text x="473" y="196" font-size="14" font-weight="700" fill="var(--accent-ink)" text-anchor="middle">Safety / Review — the only path onward</text>
<text class="hotnote" x="473" y="217" text-anchor="middle">component weight ratings and K-level ranges</text>
<text class="hotnote" x="473" y="234" text-anchor="middle">verified deterministically, by tool</text>

<!-- revise loop: back to the recommendation, bounded -->
<path class="conn" d="M646,200 L664,200 L664,103 L650,103" marker-end="url(#arw)"/>
<text class="t2 note" x="628" y="150" text-anchor="end">revise — concrete changes, bounded</text>

<!-- escalate -->
<path class="conn" d="M473,248 L473,286" marker-end="url(#arw)"/>
<text class="t2 note" x="640" y="264" text-anchor="end">red flags → escalate</text>
<rect class="node" x="466" y="288" width="180" height="46" rx="10"/>
<text class="t" x="556" y="310" font-size="13" font-weight="700" text-anchor="middle">Clinical team</text>
<text class="t2 note" x="556" y="326" text-anchor="middle">a human decides</text>

<!-- documentation -->
<rect class="node" x="246" y="288" width="180" height="46" rx="10"/>
<text class="t" x="336" y="310" font-size="13" font-weight="700" text-anchor="middle">Documentation</text>
<text class="t2 note" x="336" y="326" text-anchor="middle">verified record</text>
<path class="conn" d="M400,248 L360,288" marker-end="url(#arw)"/>

<!-- run log -->
<rect class="panel" x="34" y="288" width="190" height="46" rx="10"/>
<text class="t" x="129" y="310" font-size="12.5" font-weight="700" text-anchor="middle">events.jsonl</text>
<text class="t2 note" x="129" y="326" text-anchor="middle">every hand-off and verdict</text>
<path class="dot" d="M224,311 L246,311"/>

<!-- planned stages -->
<text class="badge" x="34" y="384">PLANNED — NOT BUILT</text>
<rect class="plan" x="34" y="396" width="300" height="76" rx="12"/>
<text class="t" x="50" y="420" font-size="13" font-weight="700">Stage C — fabrication (LangGraph)</text>
<text class="t2 note" x="50" y="440">3D scan → parametric CAD → scheduling → QA,</text>
<text class="t2 note" x="50" y="457">with a QA-to-CAD feedback edge</text>

<rect class="plan" x="346" y="396" width="300" height="76" rx="12"/>
<text class="t" x="362" y="420" font-size="13" font-weight="700">Stage A — real-time control (AutoGen)</text>
<text class="t2 note" x="362" y="440">simulated EMG/IMU, fast loop with a safety</text>
<text class="t2 note" x="362" y="457">supervisor on the command path</text>

<rect class="panel" x="34" y="490" width="612" height="52" rx="10"/>
<text class="t2 note" x="50" y="512">A research prototype. Not a certified clinical tool — every output is meant for review</text>
<text class="t2 note" x="50" y="529">by a certified prosthetist/orthotist and the treating physician.</text>
</svg>
